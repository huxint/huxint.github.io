<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 760" width="1220" height="760" role="img" aria-labelledby="ao-title ao-desc">
  <title id="ao-title">Orangutan 系统架构</title>
  <desc id="ao-desc">四类入口（命令行、Web、外部聊天、定时触发）汇入同一个装配层；装配层解析参数、加载配置、派生运行时身份并组装运行时；核心 AgentLoop 与 ProviderSystem、ToolRegistry 双向交互，并驱动记忆会话、多 Agent 编排、自动化、技能扩展四类能力，会话、记忆、自动化调度、信箱与团队元数据落在 SQLite。</desc>

  <defs>
    <style>
      text { font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Segoe UI",system-ui,sans-serif; }
      .mono { font-family: "SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace; }
      .h1  { font-size: 23px;   font-weight: 700; fill: #12283e; letter-spacing: .3px; }
      .h2  { font-size: 12.5px; fill: #6b7d92; }
      .sec { font-size: 10.5px; font-weight: 700; fill: #93a4b6; letter-spacing: 1.4px; }
      .t   { font-size: 13.5px; font-weight: 700; fill: #16283c; }
      .d   { font-size: 11px;   fill: #67788c; }
      .p   { font-size: 9.5px;  fill: #8494a6; }
      .tag { font-size: 10.5px; font-weight: 700; }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfcfa"/>
      <stop offset="1" stop-color="#f2f5f8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eefaf7"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f2740" flood-opacity="0.10"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0d6d61" flood-opacity="0.16"/>
    </filter>

    <marker id="m-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#a3b3c4"/>
    </marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#12a594"/>
    </marker>
    <marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#3b82f6"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#e9932a"/>
    </marker>
    <marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#8b5cf6"/>
    </marker>

    <g id="i-term" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2"/><path d="m4.6 6.4 2.2 1.8-2.2 1.8M8.4 10.4h3"/>
    </g>
    <g id="i-globe" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.7 1.9 2.6 4 2.6 6.2S9.7 12.3 8 14.2C6.3 12.3 5.4 10.2 5.4 8S6.3 3.7 8 1.8Z"/>
    </g>
    <g id="i-chat" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M3 3h10a1.6 1.6 0 0 1 1.6 1.6v4.8A1.6 1.6 0 0 1 13 11H7.2L4 13.4V11H3a1.6 1.6 0 0 1-1.6-1.6V4.6A1.6 1.6 0 0 1 3 3Z"/>
    </g>
    <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="8" cy="8" r="6.2"/><path d="M8 4.4V8l2.6 1.6"/>
    </g>
    <g id="i-puzzle" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M6.4 2.2a1.6 1.6 0 0 1 3.2 0v.9h2.3a1 1 0 0 1 1 1v2.3h.9a1.6 1.6 0 0 1 0 3.2h-.9v2.3a1 1 0 0 1-1 1H9.6v-.9a1.6 1.6 0 0 0-3.2 0v.9H4.1a1 1 0 0 1-1-1V9.6h-.9a1.6 1.6 0 0 1 0-3.2h.9V4.1a1 1 0 0 1 1-1h2.3Z"/>
    </g>
    <g id="i-cloud" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M5 12.4h6.3a2.9 2.9 0 0 0 .3-5.8A3.9 3.9 0 0 0 4.3 7 2.7 2.7 0 0 0 5 12.4Z"/>
    </g>
    <g id="i-tool" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M10.7 2.4a3.7 3.7 0 0 0-4.5 4.7L2.5 10.8a1.45 1.45 0 0 0 2 2l3.7-3.7a3.7 3.7 0 0 0 4.7-4.5l-2.1 2.1-1.9-.5-.5-1.9Z"/>
    </g>
    <g id="i-db" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="8" cy="4" rx="5" ry="2.1"/><path d="M3 4v8c0 1.2 2.2 2.1 5 2.1s5-.9 5-2.1V4"/><path d="M3 8c0 1.2 2.2 2.1 5 2.1s5-.9 5-2.1"/>
    </g>
    <g id="i-team" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="8" cy="3.4" r="2"/><circle cx="3.2" cy="11.6" r="2"/><circle cx="12.8" cy="11.6" r="2"/>
      <path d="M6.6 5.1 4.5 9.9M9.4 5.1l2.1 4.8M5.2 11.6h5.6"/>
    </g>
    <g id="i-spark" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M8 1.8 9.7 6.3 14.2 8 9.7 9.7 8 14.2 6.3 9.7 1.8 8 6.3 6.3Z"/>
    </g>
  </defs>

  <rect width="1220" height="760" fill="url(#bg)"/>

  <text class="h1" x="610" y="44" text-anchor="middle">Orangutan · 系统架构</text>
  <text class="h2" x="610" y="70" text-anchor="middle">四个入口，一套运行时 —— 命令行、Web、聊天、定时任务跑的是同一个 Agent 循环</text>

  <!-- ═══ edges (drawn under the cards) ═══════════════════════════════════ -->
  <g fill="none" stroke="#a3b3c4" stroke-width="1.7" marker-end="url(#m-gray)">
    <path d="M161.5 182 V214"/>
    <path d="M460.5 182 V214"/>
    <path d="M759.5 182 V214"/>
    <path d="M1058.5 182 V214"/>
  </g>
  <path d="M610 306 V336" fill="none" stroke="#12a594" stroke-width="2" stroke-opacity="0.6" marker-end="url(#m-teal)"/>

  <!-- core ↔ provider -->
  <path d="M360 408 H328" fill="none" stroke="#12a594" stroke-width="1.8" stroke-opacity="0.65" marker-end="url(#m-teal)"/>
  <path d="M324 462 H356" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-opacity="0.65" marker-end="url(#m-blue)"/>
  <!-- core ↔ tools -->
  <path d="M860 408 H892" fill="none" stroke="#12a594" stroke-width="1.8" stroke-opacity="0.65" marker-end="url(#m-teal)"/>
  <path d="M896 462 H864" fill="none" stroke="#e9932a" stroke-width="1.8" stroke-opacity="0.65" marker-end="url(#m-amber)"/>

  <!-- core → capability bus -->
  <path d="M610 530 V548" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.55"/>
  <path d="M161.5 548 H1058.5" fill="none" stroke="#8b5cf6" stroke-width="1.6" stroke-opacity="0.4" stroke-dasharray="9 7"/>
  <g fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-opacity="0.55" marker-end="url(#m-purple)">
    <path d="M161.5 548 V562"/><path d="M460.5 548 V562"/><path d="M759.5 548 V562"/><path d="M1058.5 548 V562"/>
  </g>
  <!-- capabilities → sqlite -->
  <g fill="none" stroke="#a3b3c4" stroke-width="1.6" marker-end="url(#m-gray)">
    <path d="M161.5 664 V686"/><path d="M460.5 664 V686"/><path d="M759.5 664 V686"/><path d="M1058.5 664 V686"/>
  </g>

  <!-- ═══ ① entry layer ═══════════════════════════════════════════════════ -->
  <text class="sec" x="24" y="96">① 入口层</text>
  <text class="p"   x="1196" y="96" text-anchor="end">同一条消息，不同的来源</text>

  <g>
    <rect x="24" y="108" width="275" height="74" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="44" y="118" width="30" height="30" rx="9" fill="#12a594" fill-opacity="0.1"/>
    <use href="#i-term" x="51" y="125" color="#12a594"/>
    <text class="t" x="84" y="138">命令行</text>
    <text class="d" x="44" y="168">交互式 REPL、单次提问、斜杠命令</text>
  </g>
  <g>
    <rect x="323" y="108" width="275" height="74" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="343" y="118" width="30" height="30" rx="9" fill="#3b82f6" fill-opacity="0.1"/>
    <use href="#i-globe" x="350" y="125" color="#3b82f6"/>
    <text class="t" x="383" y="138">Web</text>
    <text class="d" x="343" y="168">HTTP chat 接口与 SSE 事件流</text>
  </g>
  <g>
    <rect x="622" y="108" width="275" height="74" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="642" y="118" width="30" height="30" rx="9" fill="#6366f1" fill-opacity="0.1"/>
    <use href="#i-chat" x="649" y="125" color="#6366f1"/>
    <text class="t" x="682" y="138">外部聊天</text>
    <text class="d" x="642" y="168">消息进队列，按会话分发到各自的任务池</text>
  </g>
  <g>
    <rect x="921" y="108" width="275" height="74" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="941" y="118" width="30" height="30" rx="9" fill="#e9932a" fill-opacity="0.1"/>
    <use href="#i-clock" x="948" y="125" color="#e9932a"/>
    <text class="t" x="981" y="138">定时触发</text>
    <text class="d" x="941" y="168">到点自己醒来，没有人在也能干活</text>
  </g>

  <!-- ═══ ② bootstrap layer ═══════════════════════════════════════════════ -->
  <text class="sec" x="24" y="210">② 装配层</text>
  <text class="p"   x="1196" y="210" text-anchor="end">新增运行时能力只接这一条路径，入口侧不用改</text>

  <g>
    <rect x="24" y="218" width="1172" height="88" rx="16" fill="#ffffff" stroke="#d6e0ea" filter="url(#soft)"/>
    <rect x="24" y="218" width="1172" height="88" rx="16" fill="#12a594" fill-opacity="0.03"/>
    <rect x="44" y="240" width="30" height="30" rx="9" fill="#12a594" fill-opacity="0.1"/>
    <use href="#i-puzzle" x="51" y="247" color="#12a594"/>
    <text class="t" x="84" y="256">运行时装配</text>
    <text class="p" x="44" y="288">把一次运行需要的东西装好，再交给核心</text>

    <g>
      <rect x="300" y="238" width="209" height="48" rx="10" fill="#f5f8fb" stroke="#e3eaf2"/>
      <text class="tag" x="316" y="258" fill="#0e8a7c">1 · 解析命令行</text>
      <text class="p"   x="316" y="275">决定入口与运行模式</text>
    </g>
    <g>
      <rect x="529" y="238" width="209" height="48" rx="10" fill="#f5f8fb" stroke="#e3eaf2"/>
      <text class="tag" x="545" y="258" fill="#0e8a7c">2 · 加载配置</text>
      <text class="p"   x="545" y="275">解密密钥、展开环境变量</text>
    </g>
    <g>
      <rect x="758" y="238" width="209" height="48" rx="10" fill="#f5f8fb" stroke="#e3eaf2"/>
      <text class="tag" x="774" y="258" fill="#0e8a7c">3 · 派生运行时身份</text>
      <text class="p"   x="774" y="275">决定会话与记忆的归属</text>
    </g>
    <g>
      <rect x="987" y="238" width="209" height="48" rx="10" fill="#f5f8fb" stroke="#e3eaf2"/>
      <text class="tag" x="1003" y="258" fill="#0e8a7c">4 · 组装运行时</text>
      <text class="p"   x="1003" y="275">模型 + 工具 + 记忆 + 钩子</text>
    </g>
  </g>

  <!-- ═══ ③ runtime core ══════════════════════════════════════════════════ -->
  <text class="sec" x="24" y="332">③ 运行时核心</text>

  <!-- ProviderSystem -->
  <g>
    <rect x="24" y="346" width="300" height="178" rx="16" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="44" y="358" width="30" height="30" rx="9" fill="#3b82f6" fill-opacity="0.1"/>
    <use href="#i-cloud" x="51" y="365" color="#3b82f6"/>
    <text class="t" x="84" y="378">模型接入</text>

    <g>
      <rect x="44" y="404" width="260" height="28" rx="8" fill="#f2f7fd"/>
      <text class="tag" x="56" y="422" fill="#3b82f6">传输</text>
      <text class="d"   x="118" y="422">HTTP 与流式响应</text>
    </g>
    <g>
      <rect x="44" y="438" width="260" height="28" rx="8" fill="#f2f7fd"/>
      <text class="tag" x="56" y="456" fill="#3b82f6">协议</text>
      <text class="d"   x="118" y="456">各家 API 的差异都收在这层</text>
    </g>
    <g>
      <rect x="44" y="472" width="260" height="28" rx="8" fill="#f2f7fd"/>
      <text class="tag" x="56" y="490" fill="#3b82f6">执行</text>
      <text class="d"   x="118" y="490">重试、换模型兜底、用量统计</text>
    </g>
    <text class="p" x="44" y="514">一条路由 = 主模型 + 一串兜底模型</text>
  </g>

  <!-- AgentLoop core -->
  <g>
    <rect x="360" y="340" width="500" height="190" rx="22" fill="url(#core)" stroke="#12a594" stroke-opacity="0.4" stroke-width="1.6" filter="url(#lift)"/>

    <g transform="translate(438,442)">
      <circle r="46" fill="#12a594" opacity="0.1"/>
      <g>
        <circle r="40" fill="none" stroke="#12a594" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="3 9"/>
      </g>
      <g>
        <circle r="32" fill="none" stroke="#12a594" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="7 8"/>
      </g>
      <circle r="24" fill="#e6f7f4" stroke="#12a594" stroke-opacity="0.35"/>
      <g stroke="#0e8a7c" stroke-width="2.3" fill="none" stroke-linecap="round">
        <path d="M-12 -4.5 A 12.8 12.8 0 0 1 10.5 -6"/>
        <path d="M12 4.5 A 12.8 12.8 0 0 1 -10.5 6"/>
      </g>
      <path d="M10.6 -11.4 L11.6 -2.6 L4.2 -6.4 Z" fill="#0e8a7c"/>
      <path d="M-10.6 11.4 L-11.6 2.6 L-4.2 6.4 Z" fill="#0e8a7c"/>
    </g>

    <text class="h1" x="500" y="392" font-size="21">AgentLoop</text>
    <text class="p"  x="500" y="410">想一步 → 用工具 → 再想一步，直到给出答案</text>
    <g fill="#12a594">
      <circle cx="504" cy="432" r="2.6"/><circle cx="504" cy="454" r="2.6"/>
      <circle cx="504" cy="476" r="2.6"/><circle cx="504" cy="498" r="2.6"/>
    </g>
    <text class="d" x="516" y="436">每轮重新组装：系统提示 + 技能 + 工具；记忆循环前召回一次</text>
    <text class="d" x="516" y="458">派发工具调用，把结果写回对话历史</text>
    <text class="d" x="516" y="480">历史压缩 · 记忆蒸馏 · 队友消息注入</text>
    <text class="d" x="516" y="502">最多 20 轮，随时可被停止令牌打断</text>
  </g>

  <!-- ToolRegistry -->
  <g>
    <rect x="896" y="346" width="300" height="178" rx="16" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="916" y="358" width="30" height="30" rx="9" fill="#e9932a" fill-opacity="0.1"/>
    <use href="#i-tool" x="923" y="365" color="#e9932a"/>
    <text class="t" x="956" y="378">工具系统</text>

    <g>
      <rect x="916" y="404" width="260" height="28" rx="8" fill="#fdf6ec"/>
      <text class="tag" x="928" y="422" fill="#d4820f">注册</text>
      <text class="d"   x="990" y="422">一处登记，定义按需提供给模型</text>
    </g>
    <g>
      <rect x="916" y="438" width="260" height="28" rx="8" fill="#fdf6ec"/>
      <text class="tag" x="928" y="456" fill="#d4820f">权限</text>
      <text class="d"   x="990" y="456">放行 / 询问 / 拒绝 + 安全检查</text>
    </g>
    <g>
      <rect x="916" y="472" width="260" height="28" rx="8" fill="#fdf6ec"/>
      <text class="tag" x="928" y="490" fill="#d4820f">钩子</text>
      <text class="d"   x="990" y="490">在工具前后挂自己的脚本</text>
    </g>
    <text class="p" x="916" y="514">文件 · 命令行 · MCP · 记忆 · 脚本 · 技能 · …</text>
  </g>

  <!-- ═══ ④ capabilities ══════════════════════════════════════════════════ -->
  <text class="sec" x="24" y="554">④ 能力与状态</text>

  <g>
    <rect x="24" y="566" width="275" height="98" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="44" y="580" width="30" height="30" rx="9" fill="#8b5cf6" fill-opacity="0.1"/>
    <use href="#i-db" x="51" y="587" color="#8b5cf6"/>
    <text class="t" x="84" y="600">记忆与会话</text>
    <text class="d" x="44" y="628">会话可保存、可恢复</text>
    <text class="d" x="44" y="650">长期记忆按作用域隔离</text>
  </g>
  <g>
    <rect x="323" y="566" width="275" height="98" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="343" y="580" width="30" height="30" rx="9" fill="#8b5cf6" fill-opacity="0.1"/>
    <use href="#i-team" x="350" y="587" color="#8b5cf6"/>
    <text class="t" x="383" y="600">多 Agent 编排</text>
    <text class="d" x="343" y="628">派出队友、控制并发、随时叫停</text>
    <text class="d" x="343" y="650">队友之间用信箱直接沟通</text>
  </g>
  <g>
    <rect x="622" y="566" width="275" height="98" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="642" y="580" width="30" height="30" rx="9" fill="#8b5cf6" fill-opacity="0.1"/>
    <use href="#i-clock" x="649" y="587" color="#8b5cf6"/>
    <text class="t" x="682" y="600">自动化</text>
    <text class="d" x="642" y="628">定时 / 周期 / 一次性触发</text>
    <text class="d" x="642" y="650">每次触发都是全新的运行时</text>
  </g>
  <g>
    <rect x="921" y="566" width="275" height="98" rx="14" fill="#ffffff" stroke="#dbe3ec" filter="url(#soft)"/>
    <rect x="941" y="580" width="30" height="30" rx="9" fill="#8b5cf6" fill-opacity="0.1"/>
    <use href="#i-spark" x="948" y="587" color="#8b5cf6"/>
    <text class="t" x="981" y="600">技能与扩展</text>
    <text class="d" x="941" y="628">技能按需注入提示词</text>
    <text class="d" x="941" y="650">外部 MCP 工具即插即用</text>
  </g>

  <!-- ═══ ⑤ storage ═══════════════════════════════════════════════════════ -->
  <g>
    <rect x="24" y="686" width="1172" height="46" rx="12" fill="#f4f2fb" stroke="#e0daf6"/>
    <use href="#i-db" x="44" y="701" color="#8b5cf6"/>
