<svg xmlns="http://www.w3.org/2000/svg" width="960" height="690" viewBox="0 0 960 690" role="img" aria-labelledby="title description">
  <title id="title">存储存在时间与类对象生命周期的区别</title>
  <desc id="description">自动字节数组先提供满足 Widget 大小与对齐要求的存储。placement new 在其中构造 Widget；初始化完成后进入对象生命周期，析构函数调用开始时生命周期结束。析构结束后原始存储仍然存在，直到字节数组所在作用域结束。构造和析构期间另有专门的语言规则。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 8 4-8 4" fill="none" stroke="#69788e" stroke-width="1.6"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#243247}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:600}.body{font-size:21px}.note{font-size:19px;fill:#596980}.guide{stroke:#c7d1df;stroke-width:1.3;stroke-dasharray:4 5}
    </style>
  </defs>
  <rect width="960" height="690" rx="16" fill="#fbfcfe"/>
  <text x="44" y="58" class="title">一份存储，可以先存在，再承载一个对象</text>
  <text x="44" y="97" class="note">以 alignas(Widget) 的字节数组和 placement new 为例。</text>

  <text x="88" y="160" text-anchor="middle" class="note">准备存储</text>
  <text x="300" y="160" text-anchor="middle" class="note">初始化完成</text>
  <text x="650" y="160" text-anchor="middle" class="note">析构开始</text>
  <text x="872" y="160" text-anchor="middle" class="note">作用域结束</text>
  <path d="M88 174v308 M300 174v308 M650 174v308 M872 174v308" class="guide"/>

  <text x="88" y="208" class="body">原始存储</text>
  <rect x="88" y="224" width="784" height="66" rx="8" fill="#e9f1ff" stroke="#a9c3ea"/>
  <text x="114" y="265" class="body">大小与对齐满足 Widget；这份字节存储一直存在</text>

  <text x="88" y="341" class="body">Widget 对象</text>
  <rect x="184" y="357" width="116" height="66" rx="6" fill="#eeeafa" stroke="#beb0dc"/>
  <text x="242" y="398" text-anchor="middle" class="body">构造中</text>
  <rect x="300" y="357" width="350" height="66" rx="6" fill="#e5f5ee" stroke="#9ccbb7"/>
  <text x="475" y="398" text-anchor="middle" class="label">Widget 生命周期</text>
  <rect x="650" y="357" width="116" height="66" rx="6" fill="#fff3da" stroke="#ddc48f"/>
  <text x="708" y="398" text-anchor="middle" class="body">析构中</text>
  <text x="475" y="454" text-anchor="middle" class="note">构造与析构期间适用专门的语言规则</text>
  <path d="M88 488h806" fill="none" stroke="#69788e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="878" y="516" class="note">时间</text>

  <rect x="44" y="545" width="872" height="112" rx="10" fill="#f0f3f8" stroke="#c7d1df"/>
  <text x="68" y="583" class="body">析构后不能继续访问旧对象；原始存储仍可以存在。</text>
  <text x="68" y="614" class="note">后续可以按规则在其中构造新对象，或让存储随作用域结束而回收。</text>
  <text x="68" y="642" class="note">一个指针仍保存该地址，不代表其中的旧对象仍然活着。</text>
</svg>
