<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#F5EFE3">
  <title>Workshop · huxint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,30..100,0..1;1,9..144,300..700,30..100,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
  <header class="site-header" data-include="/partials/header.html"></header>
  <noscript>
    <nav class="noscript-header">
      <a href="/"><strong>huxint</strong></a>
      <a href="/">首页</a>
      <a href="/blog.html">博客</a>
      <a href="/projects.html">项目</a>
      <a href="/about.html">关于</a>
    </nav>
  </noscript>

  <main class="container">
    <section class="section">
      <div class="section__head">
        <div>
          <div class="section__label">// §03 — Workshop</div>
          <h1 class="section__title">那些我 <em>正在打磨</em> 的小东西</h1>
        </div>
        <span class="contrib__streak" id="proj-count">loading…</span>
      </div>
      <p style="max-width: 560px; color: var(--text-muted); font-family: var(--font-display); font-style: italic; font-size: var(--fs-md); line-height: 1.55; margin-bottom: var(--space-6); font-variation-settings: 'opsz' 36, 'SOFT' 50;">
        所有项目都从 <span class="mono" style="color: var(--sienna);">github.com/huxint</span> 直接抓取，按 star 数 + 最近更新排序。点哪个进哪个。
      </p>

      <div class="proj-controls">
        <div class="proj-filter" role="tablist" id="proj-filter">
          <button data-filter="all" class="is-active" role="tab" aria-selected="true">All</button>
          <button data-filter="starred" role="tab" aria-selected="false">★ Starred</button>
          <button data-filter="recent" role="tab" aria-selected="false">Recent</button>
        </div>
        <a href="https://github.com/huxint" target="_blank" rel="noopener noreferrer" class="section__cta">
          GitHub <span class="arrow">↗</span>
        </a>
      </div>

      <div id="projects-grid" class="proj-grid">
        <p class="proj-empty">从 GitHub 抓取中 ✦ ✦ ✦</p>
      </div>
    </section>
  </main>

  <footer class="site-footer" data-include="/partials/footer.html"></footer>

  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/projects.js" defer></script>

</html>
